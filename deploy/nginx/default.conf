server {
    listen 80;
    server_name www.ovolbach.sk;

    if ($legacy_target != "") {
        return 301 https://ovolbach.sk$legacy_target$is_args$args;
    }
    return 301 https://ovolbach.sk$request_uri;
}

server {
    listen 80 default_server;
    server_name localhost;

    # The TLS proxy talks to this container over HTTP. Keep nginx redirects
    # relative so a directory redirect preserves the visitor's HTTPS URL.
    absolute_redirect off;

    error_page 404 /404.html;

    if ($legacy_target != "") {
        return 301 $legacy_target$is_args$args;
    }

    # Match the original client URI, not the internal index.html lookup for /.
    if ($request_uri ~ ^/index\.html(?:\?|$)) {
        return 301 /$is_args$args;
    }
    # Never copy a leading //, backslash, or query text into Location.
    if ($request_uri ~ ^/(?<canonical_dir>[^/?\x5c]+(?:/[^/?\x5c]+)*)/index\.html(?:\?|$)) {
        return 301 /$canonical_dir/$is_args$args;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
    }

    location = /404.html {
        internal;
        root /usr/share/nginx/html;
    }
}
